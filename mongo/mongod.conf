# ═══════════════════════════════════════════════════════════════════════════════
# MongoDB Secure Configuration
# Production-ready security settings
# ═══════════════════════════════════════════════════════════════════════════════

# ── Storage Configuration ──────────────────────────────────────────────────────
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25  # Adjust based on available memory
      journalCompressor: zlib
    collectionConfig:
      blockCompressor: zlib
    indexConfig:
      prefixCompression: true

# ── Security Configuration ─────────────────────────────────────────────────────
security:
  # Enable authentication (required)
  authorization: enabled
  
  # JavaScript execution (disabled for security)
  javascriptEnabled: false
  
  # Redact client data in logs
  # redactClientLogData: true  # Enable in production

# ── Network Configuration ──────────────────────────────────────────────────────
net:
  # Bind to localhost and container network only
  bindIp: 127.0.0.1,mongodb
  port: 27017
  
  # Connection limits
  maxIncomingConnections: 100
  
  # Wire protocol compression
  compression:
    compressors: zlib,zstd,snappy
  
  # TLS/SSL (Enable in production)
  # tls:
  #   mode: requireTLS
  #   certificateKeyFile: /etc/ssl/mongodb.pem
  #   CAFile: /etc/ssl/ca.pem
  #   allowConnectionsWithoutCertificates: false

# ── Process Management ─────────────────────────────────────────────────────────
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# ── Operation Profiling ────────────────────────────────────────────────────────
operationProfiling:
  # Profile slow queries for optimization
  slowOpThresholdMs: 100
  mode: slowOp
  
# ── Replication (for production HA) ────────────────────────────────────────────
# replication:
#   replSetName: rs0

# ── Sharding (for production scale) ────────────────────────────────────────────
# sharding:
#   clusterRole: shardsvr

# ── System Log ─────────────────────────────────────────────────────────────────
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  
# ── Audit Log (Enterprise only) ────────────────────────────────────────────────
# auditLog:
#   destination: file
