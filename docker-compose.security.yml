version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# VulneraX Secure Docker Compose
# Production-like security hardening for local development
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  # 🔒 Network Segmentation: frontend can access internet, backend cannot
  frontend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  
  backend_net:
    driver: bridge
    internal: true  # No internet access from backend
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  ollama_data:
    driver: local
  mongo_data:
    driver: local
  nginx_logs:
    driver: local
  nextjs_cache:
    driver: local

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Nginx Reverse Proxy (Only exposed service)
  # ═══════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    container_name: travlo_nginx
    hostname: nginx
    networks:
      frontend_net:
        ipv4_address: 172.20.0.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 🔒 Read-only configuration
      - ./nginx/nginx-secure.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      # 🔒 Read-only SSL certificates
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 📝 Writable log directory
      - nginx_logs:/var/log/nginx
    # 🔒 Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Required for some Alpine operations
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE    # Required to bind to ports 80/443
      - SETGID              # Required by nginx
      - SETUID              # Required by nginx
      - CHOWN               # Required for temp directories
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=100m,mode=0755
      - /var/run:noexec,nosuid,size=10m,mode=0755
    user: "nginx:nginx"    # Run as non-root nginx user
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      nextjs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost/health", "--no-check-certificate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ═══════════════════════════════════════════════════════════════════════════
  # Next.js Application
  # ═══════════════════════════════════════════════════════════════════════════
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: travlo_nextjs
    hostname: nextjs
    networks:
      frontend_net:
        ipv4_address: 172.20.0.3
      backend_net:
        ipv4_address: 172.21.0.2
    expose:
      - "3000"
    environment:
      # Application settings
      - NODE_ENV=production
      - PORT=3000
      # Database with authentication
      - MONGODB_URI=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongodb:27017/vulnerax?authSource=vulnerax
      - MONGODB_DB_NAME=vulnerax
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_URL=https://vulnerax.local
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # External APIs
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_API_URL=http://ollama:11434
    env_file:
      - .env
    # 🔒 Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    user: "1000:1000"      # Non-root user (node user)
    tmpfs:
      - /tmp:noexec,nosuid,size=200m,mode=1777
    volumes:
      # 📝 Writable directories only
      - nextjs_cache:/app/.next/cache
      - /app/node_modules    # Anonymous volume for node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ═══════════════════════════════════════════════════════════════════════════
  # MongoDB with Authentication
  # ═══════════════════════════════════════════════════════════════════════════
  mongodb:
    image: mongo:7-jammy
    container_name: travlo_mongodb
    hostname: mongodb
    networks:
      backend_net:
        ipv4_address: 172.21.0.3
    expose:
      - "27017"
    volumes:
      # 📝 Data persistence
      - mongo_data:/data/db
      # 🔒 Read-only initialization scripts
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongo/mongod.conf:/etc/mongod.conf:ro
      - ./mongo/security.js:/docker-entrypoint-initdb.d/security.js:ro
    environment:
      # Root credentials (required for initialization)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: vulnerax
      # App user credentials (passed to init script)
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    # 🔒 Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "999:999"        # Official MongoDB non-root user
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,mode=1777
      - /data/configdb:noexec,nosuid,size=10m
    command: ["mongod", "--config", "/etc/mongod.conf"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ═══════════════════════════════════════════════════════════════════════════
  # Ollama LLM Service
  # ═══════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: travlo_ollama
    hostname: ollama
    networks:
      backend_net:
        ipv4_address: 172.21.0.4
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    # 🔒 Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Ollama needs more time to start
    # Resource limits (adjust based on your hardware)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

# ═══════════════════════════════════════════════════════════════════════════════
# Notes for production deployment:
# ═══════════════════════════════════════════════════════════════════════════════
# 1. Replace mkcert certificates with Let's Encrypt or commercial CA
# 2. Enable MongoDB TLS encryption
# 3. Use external secret management (HashiCorp Vault, AWS Secrets Manager)
# 4. Enable container image scanning
# 5. Use orchestration (Kubernetes) for high availability
# 6. Implement centralized logging (ELK stack, Splunk)
# 7. Enable network policies for pod-to-pod communication
# 8. Use image digests instead of tags for immutability
