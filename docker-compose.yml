version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
# travlo_public : nextjs + nginx can reach the internet (needed for Anthropic API)
# travlo_internal: ollama + mongodb are isolated with no internet egress
networks:
  travlo_public:
    driver: bridge
  travlo_internal:
    driver: bridge
    internal: true

volumes:
  ollama_data:           # Persists downloaded model weights
  mongo_data:            # Persists MongoDB data
  whisper_models:        # Persists downloaded Whisper model weights

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: travlo_nginx
    networks:
      - travlo_public
    ports:
      - "80:80"          # Only exposed port to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── Next.js application ────────────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travlo_nextjs
    networks:
      - travlo_public    # Internet access for Anthropic API fallback
      - travlo_internal  # Access to ollama + mongodb
    expose:
      - "3000"           # Internal only — Nginx proxies here
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0  # Next.js standalone must listen on all interfaces
    volumes:
      - whisper_models:/root/.cache  # Persist Whisper model weights
    depends_on:
      ollama:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── Ollama local LLM ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: travlo_ollama
    networks:
      - travlo_internal  # Internal only — no internet egress
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Give Ollama time to start before health checks begin

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: travlo_mongodb
    networks:
      - travlo_internal  # Internal only — no internet egress
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
