# ═══════════════════════════════════════════════════════════════════════════════
# Nginx Security Hardened Configuration for Multi-Tenant SaaS
# VulneraX Local Development Environment
# ═══════════════════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones ───────────────────────────────────────────────────────
# حد عام للطلبات - 50 طلب/دقيقة لكل IP
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/m;

# حد صارم للـ API - 10 طلب/ثانية مع burst
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# حد للـ auth endpoints - 5 محاولات/دقيقة (منع brute force)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Connection limiting - منع slowloris attacks
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Map for Tenant Detection ──────────────────────────────────────────────────
# استخراج الـ subdomain من hostname
map $host $tenant_id {
    default "main";
    ~^(?<subdomain>[^.]+)\.vulnerax\.local$ $subdomain;
}

# ── Map for Real IP ───────────────────────────────────────────────────────────
# استخراج IP الحقيقي من X-Forwarded-For
map $http_x_forwarded_for $real_ip {
    default $remote_addr;
    ~^(?<ip>[^,]+) $ip;
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS Server (Production-Ready TLS Configuration)
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vulnerax.local *.vulnerax.local;

    # ── SSL Certificates ──────────────────────────────────────────────────────
    ssl_certificate /etc/nginx/ssl/vulnerax.local.crt;
    ssl_certificate_key /etc/nginx/ssl/vulnerax.local.key;

    # ── Modern TLS Configuration (Mozilla SSL Configuration Generator) ────────
    # TLS 1.3 only preferred, TLS 1.2 for backwards compatibility
    ssl_protocols TLSv1.3 TLSv1.2;
    
    # Modern cipher suite
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    
    # Session configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # OCSP Stapling (يُفعل في الإنتاج فقط)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/chain.crt;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # ── Security Headers (OWASP Recommended) ──────────────────────────────────
    
    # HSTS - ⚠️ احذر في local dev (قد يجبر HTTPS على localhost)
    # في الإنتاج: max-age=63072000; includeSubDomains; preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Clickjacking Protection
    # SAMEORIGIN أفضل من DENY للـ local dev (يسمح بالـ iframe نفس المصدر)
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # MIME Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;
    
    # ⚠️ REMOVED: X-XSS-Protection (deprecated and can be exploited via side-channels)
    # CSP is the modern replacement
    
    # Referrer Policy - OAuth compatible
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy (Feature Policy)
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), vr=(), interest-cohort=()" always;
    
    # Content Security Policy - مرن للـ Next.js
    # ⚠️ unsafe-inline/eval مؤقت للـ development
    # في الإنتاج: استخدم nonce-based CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.vulnerax.com wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        text/javascript
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;
    gzip_min_length 1000;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # ── Request Size Limits (DoS Prevention) ──────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── Timeouts (Slowloris Protection) ───────────────────────────────────────
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ── Connection Limiting ───────────────────────────────────────────────────
    limit_conn addr 10;

    # ── Proxy Settings ────────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # ── Auth Routes (Strict Rate Limiting - Anti Brute Force) ─────────────────
    location ~ ^/(api/)?auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        limit_conn addr 5;
        
        proxy_pass http://nextjs:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Tenant-ID $tenant_id;
        proxy_set_header X-Real-IP $real_ip;
        
        # CORS للـ auth endpoints
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ── API Routes (Rate Limited) ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        limit_conn addr 20;
        
        proxy_pass http://nextjs:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Tenant-ID $tenant_id;
        proxy_set_header X-Real-IP $real_ip;
        
        # CORS Headers
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
    }

    # ── Static Files (Direct Serve with Caching) ──────────────────────────────
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        
        # Security: only serve expected file types
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location /static/ {
        alias /app/public/;
        expires 1y;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── Health Check (No rate limit) ──────────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://nextjs:3000/health;
        include /etc/nginx/proxy_params;
    }

    # ── Frontend (General Rate Limit) ─────────────────────────────────────────
    location / {
        limit_req zone=general burst=30 nodelay;
        limit_conn addr 15;
        
        proxy_pass http://nextjs:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Tenant-ID $tenant_id;
        proxy_set_header X-Real-IP $real_ip;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Security: Deny Hidden Files ───────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Security: Block Common Exploit Paths ──────────────────────────────────
    location ~* ^/(api/|app/|config/|db/|test/|tests/|spec/|\.env|\.git|\.svn|\.htaccess|\.htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Security: Block Backup Files ──────────────────────────────────────────
    location ~* \.(bak|backup|old|orig|save|swp|tmp|temp|copy|~|#)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Security: Block Sensitive Extensions ──────────────────────────────────
    location ~* \.(env|gitignore|gitattributes|lock|log|md|sql|yaml|yml|toml|ini|conf|config|key|pem|crt|p12|pfx)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Error Pages (Don't leak server info) ──────────────────────────────────
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 /error;
    error_page 500 501 502 503 504 505 506 507 508 510 511 /error;
    
    location = /error {
        internal;
        add_header Content-Type application/json;
        return 200 '{"error":"Request could not be processed"}';
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP to HTTPS Redirect
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name vulnerax.local *.vulnerax.local;
    
    # Security: No sensitive headers on HTTP
    server_tokens off;
    
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Let's Encrypt challenge (for production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ── Log Format (JSON for easier parsing) ──────────────────────────────────────
log_format json_analytics escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$real_ip","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent","tenant_id":"$tenant_id",'
    '"upstream_response_time":"$upstream_response_time"}';

access_log /var/log/nginx/access.log json_analytics;
