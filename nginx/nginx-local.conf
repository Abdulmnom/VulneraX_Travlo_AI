# ═══════════════════════════════════════════════════════════════════════════════
# Nginx Configuration for Local Production Simulation
# VulneraX - No Docker Required
# ═══════════════════════════════════════════════════════════════════════════════

# Worker Processes
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ═══════════════════════════════════════════════════════════════════════════
    # Logging Format (JSON for analytics)
    # ═══════════════════════════════════════════════════════════════════════════
    log_format json_analytics escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$real_ip","host":"$host","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent","tenant_id":"$tenant_id",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log logs/access.log json_analytics;

    # ═══════════════════════════════════════════════════════════════════════════
    # Performance Settings
    # ═══════════════════════════════════════════════════════════════════════════
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ═══════════════════════════════════════════════════════════════════════════
    # Rate Limiting Zones
    # ═══════════════════════════════════════════════════════════════════════════
    # General requests: 100/min per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    
    # API requests: 30/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    
    # Auth endpoints: 5/min per IP (anti brute-force)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    
    # Tenant-based rate limiting (for multi-tenant)
    limit_req_zone $tenant_id zone=tenant:10m rate=200r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ═══════════════════════════════════════════════════════════════════════════
    # Map for Tenant Detection
    # ═══════════════════════════════════════════════════════════════════════════
    map $host $tenant_id {
        default "main";
        ~^(?<subdomain>[^.]+)\.vulnerax\.local$ $subdomain;
        ~^(?<subdomain>[^.]+)\.vulnerax\.test$ $subdomain;
    }

    # Map for Real IP (behind proxy)
    map $http_x_forwarded_for $real_ip {
        default $remote_addr;
        ~^(?<ip>[^,]+) $ip;
    }

    # Request ID for tracing
    map $http_x_request_id $request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Gzip Compression
    # ═══════════════════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript
        font/opentype
        image/svg+xml
        image/x-icon;

    # ═══════════════════════════════════════════════════════════════════════════
    # Upstream: Next.js Development Server
    # ═══════════════════════════════════════════════════════════════════════════
    upstream nextjs {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTPS Server
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name vulnerax.local *.vulnerax.local vulnerax.test *.vulnerax.test;

        # SSL Certificates (Generated by mkcert)
        ssl_certificate ssl/vulnerax.local.crt;
        ssl_certificate_key ssl/vulnerax.local.key;

        # Modern TLS Configuration
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ═══════════════════════════════════════════════════════════════════════
        # Security Headers
        # ═══════════════════════════════════════════════════════════════════════
        # HSTS (for local dev - careful with this!)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Clickjacking Protection
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # MIME Sniffing Protection
        add_header X-Content-Type-Options "nosniff" always;
        
        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Permissions Policy
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), vr=(), interest-cohort=()" always;
        
        # Content Security Policy (development-friendly)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.vulnerax.com wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # ═══════════════════════════════════════════════════════════════════════
        # Timeouts & Limits (DoS Protection)
        # ═══════════════════════════════════════════════════════════════════════
        client_body_timeout 12s;
        client_header_timeout 12s;
        send_timeout 10s;
        limit_conn addr 20;

        # ═══════════════════════════════════════════════════════════════════════
        # Proxy Settings
        # ═══════════════════════════════════════════════════════════════════════
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $tenant_id;
        proxy_set_header X-Request-ID $request_id;

        # ═══════════════════════════════════════════════════════════════════════
        # Auth Routes (Strict Rate Limiting)
        # ═══════════════════════════════════════════════════════════════════════
        location ~ ^/(api/)?auth/(login|register|forgot-password|reset-password|verify) {
            limit_req zone=auth burst=3 nodelay;
            limit_req zone=tenant burst=10 nodelay;
            limit_req_status 429;
            limit_conn addr 5;
            
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # CORS for auth
            add_header Access-Control-Allow-Origin "$scheme://$host" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # API Routes (Rate Limited)
        # ═══════════════════════════════════════════════════════════════════════
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req zone=tenant burst=50 nodelay;
            limit_req_status 429;
            limit_conn addr 20;
            
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # CORS Headers
            add_header Access-Control-Allow-Origin "$scheme://$host" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID, X-Request-ID, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header X-Tenant-ID $tenant_id always;
            add_header X-RateLimit-Limit "30" always;
            
            # Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Static Files (Next.js)
        # ═══════════════════════════════════════════════════════════════════════
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        location /static/ {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Health Check (No rate limit)
        # ═══════════════════════════════════════════════════════════════════════
        location /api/health {
            access_log off;
            proxy_pass http://nextjs;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # WebSocket Support
        # ═══════════════════════════════════════════════════════════════════════
        location /_next/webpack-hmr {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Frontend (General Rate Limit)
        # ═══════════════════════════════════════════════════════════════════════
        location / {
            limit_req zone=general burst=50 nodelay;
            limit_req zone=tenant burst=100 nodelay;
            limit_conn addr 15;
            
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Tenant header for frontend
            add_header X-Tenant-ID $tenant_id always;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Security: Deny Hidden Files
        # ═══════════════════════════════════════════════════════════════════════
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Security: Block Exploit Paths
        # ═══════════════════════════════════════════════════════════════════════
        location ~* ^/(api/|app/|config/|db/|test/|tests/|spec/|\.env|\.git|\.svn|\.htaccess|\.htpasswd) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Security: Block Backup & Sensitive Files
        # ═══════════════════════════════════════════════════════════════════════
        location ~* \.(bak|backup|old|orig|save|swp|tmp|temp|copy|~|#|env|gitignore|gitattributes|lock|log|md|sql|yaml|yml|toml|ini|conf|config|key|pem|crt|p12|pfx)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Error Pages
        # ═══════════════════════════════════════════════════════════════════════
        error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 /error;
        error_page 500 501 502 503 504 505 506 507 508 510 511 /error;
        
        location = /error {
            internal;
            add_header Content-Type application/json;
            return 200 '{"error":"Request could not be processed","code":"$status"}';
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTP to HTTPS Redirect (Optional for local dev)
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen [::]:80;
        server_name vulnerax.local *.vulnerax.local vulnerax.test *.vulnerax.test;
        
        server_tokens off;
        
        location / {
            # For local dev, you might want to proxy directly instead of redirect
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $tenant_id;
        }
    }
}
